[project]
name = "cardiowatch-backend"
version = "0.1.0"
description = "CardioWatch AI — cardiology monitoring & alarm analytics POC (synthetic data only)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyjwt>=2.8",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.uv]
package = false
