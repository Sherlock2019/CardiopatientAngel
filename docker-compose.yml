name: cardiowatch

# BIND_ADDR: 127.0.0.1 (default, local only) or 0.0.0.0 (EC2 — restrict the Security Group to your IP).
# Secrets come from .env (start.sh generates one with random values).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cardiowatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cardiowatch}
      POSTGRES_DB: cardiowatch
    ports:
      - "127.0.0.1:${DB_PORT:-55440}:5432"   # database is never exposed beyond the host
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardiowatch -d cardiowatch"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://cardiowatch:${POSTGRES_PASSWORD:-cardiowatch}@db:5432/cardiowatch
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5180,http://localhost:8081}
      HOSPITAL_TZ: ${HOSPITAL_TZ:-America/New_York}
      SEED_RANDOM: ${SEED_RANDOM:-42}
      REPO_DIR: /repo
    volumes:
      # read-only repository view for the Engineering Hub (docs, ADRs, test evidence, source traceability)
      - ./docs:/repo/docs:ro
      - ./.github:/repo/.github:ro
      - ./backend/app:/repo/backend/app:ro
      - ./backend/tests:/repo/backend/tests:ro
      - ./frontend/src:/repo/frontend/src:ro
      - ./frontend/e2e:/repo/frontend/e2e:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${API_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 60
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-5180}:80"
    restart: unless-stopped

  mobile:
    build: ./mobile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${MOBILE_PORT:-8081}:80"
    restart: unless-stopped

volumes:
  pgdata:
