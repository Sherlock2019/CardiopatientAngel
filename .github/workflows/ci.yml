name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cardiowatch
          POSTGRES_PASSWORD: cardiowatch
          POSTGRES_DB: cardiowatch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cardiowatch" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cardiowatch:cardiowatch@localhost:5432/cardiowatch_test
      DATABASE_URL: postgresql+psycopg://cardiowatch:cardiowatch@localhost:5432/cardiowatch_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run alembic upgrade head   # migrations apply cleanly
      - run: uv run pytest --junitxml=backend-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-junit
          path: backend/backend-junit.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=frontend-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-junit
          path: frontend/frontend-junit.xml

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export --platform web --output-dir dist
